# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: earwyrm
infra:
  provider: bicep
  path: infra
hooks:
  preprovision:
    shell: sh
    run: npm run deployment-gate -- verify
    continueOnError: false
    interactive: false
  predeploy:
    shell: sh
    run: npm run deployment-gate -- verify
    continueOnError: false
    interactive: false
services:
  web:
    project: .
    language: docker
    host: containerapp
    docker:
      path: Dockerfile.web
      context: .
      remoteBuild: true
