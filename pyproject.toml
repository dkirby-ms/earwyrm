[project]
name = "earwyrm-audio-poc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "azure-cognitiveservices-speech>=1.53.0",
    "fastapi>=0.162.5",
    "numpy>=2.4.6",
    "pyjwt[crypto]>=2.15.1",
    "scipy>=1.17.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
