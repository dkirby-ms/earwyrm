name: Bootstrap web prerequisites

on:
  workflow_dispatch:
    inputs:
      action:
        description: Create credentials before provisioning, or reset and initialize the application after provisioning
        type: choice
        options: [credentials, initialize-database]
        default: credentials
      bootstrap_approved:
        description: Approve credential resource creation and scoped Key Vault role assignments
        type: boolean
        default: false
      database_initialization_approved:
        description: Approve image build, temporary private job, and PostgreSQL application reset
        type: boolean
        default: false
      data_reset_approved:
        description: Approve permanent reset of Earwyrm PostgreSQL data and app media files
        type: boolean
        default: false
      maintenance_approved:
        description: Approve stopping the app; it remains stopped after initialization
        type: boolean
        default: false
      other_writers_stopped:
        description: All other clients writing to this isolated share are stopped
        type: boolean
        default: false
      owner_issuer:
        description: Verified issuer returned by /api/identity for the initial administrator
        type: string
        default: ''
      owner_subject:
        description: Verified subject returned by /api/identity for the initial administrator
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: earwyrm-web-deployment
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (inputs.action == 'credentials' && inputs.bootstrap_approved) ||
      (inputs.action == 'initialize-database' &&
       inputs.database_initialization_approved && inputs.data_reset_approved &&
       inputs.maintenance_approved && inputs.other_writers_stopped)
    uses: ./.github/workflows/prepare-deployment.yml
    with:
      build_image: ${{ inputs.action == 'initialize-database' }}

  bootstrap:
    needs: prepare
    if: >-
      (inputs.action == 'credentials' && inputs.bootstrap_approved) ||
      (inputs.action == 'initialize-database' &&
       inputs.database_initialization_approved && inputs.data_reset_approved &&
       inputs.maintenance_approved && inputs.other_writers_stopped)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    environment: earwyrm-web
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
      AZURE_KEY_VAULT_RESOURCE_GROUP: ${{ vars.AZURE_KEY_VAULT_RESOURCE_GROUP }}
      AZURE_POSTGRESQL_PASSWORD_SECRET_NAME: ${{ vars.AZURE_POSTGRESQL_PASSWORD_SECRET_NAME }}
      AZURE_POSTGRESQL_ADMIN_LOGIN: ${{ vars.AZURE_POSTGRESQL_ADMIN_LOGIN }}
      EARWYRM_BOOTSTRAP_APPROVED: ${{ inputs.bootstrap_approved }}
      EARWYRM_DATABASE_INITIALIZATION_APPROVED: ${{ inputs.database_initialization_approved }}
      EARWYRM_DATA_RESET_APPROVED: ${{ inputs.data_reset_approved }}
      EARWYRM_MAINTENANCE_APPROVED: ${{ inputs.maintenance_approved }}
      EARWYRM_OTHER_WRITERS_STOPPED: ${{ inputs.other_writers_stopped }}
      EARWYRM_BOOTSTRAP_OWNER_ISSUER: ${{ inputs.owner_issuer }}
      EARWYRM_BOOTSTRAP_OWNER_SUBJECT: ${{ inputs.owner_subject }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: payload
          merge-multiple: true
      - name: Verify payload before extracting or executing it
        env:
          EXPECTED_SHA256: ${{ needs.prepare.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  payload/deployment.tar\n' "$EXPECTED_SHA256" | sha256sum --check --strict
          mkdir .deployment
          tar -xf payload/deployment.tar -C .deployment
      - name: GitHub OIDC login for Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Bootstrap credential prerequisites without rotating passwords
        if: inputs.action == 'credentials'
        run: node .deployment/tooling/bootstrap_deployment.js
      - name: Install Container Apps CLI for initialization inventory
        if: inputs.action == 'initialize-database'
        run: az extension add --name containerapp --upgrade
      - name: Reset and initialize the PostgreSQL store over the private network
        if: inputs.action == 'initialize-database'
        run: node .deployment/tooling/initialize_deployment.js
