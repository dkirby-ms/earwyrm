name: Approved web deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy normally; preview or provision-only are optional maintenance tools
        type: choice
        options: [deploy, preview, provision]
        default: deploy
      maintenance_approved:
        description: Approve this run and confirm all other writers to the PoC share are stopped
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: earwyrm-web-deployment
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.maintenance_approved
    uses: ./.github/workflows/prepare-deployment.yml
    with:
      build_image: ${{ inputs.action == 'deploy' }}

  deploy:
    needs: prepare
    if: inputs.maintenance_approved
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: earwyrm-web
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
      AZURE_KEY_VAULT_RESOURCE_GROUP: ${{ vars.AZURE_KEY_VAULT_RESOURCE_GROUP }}
      AZURE_POSTGRESQL_PASSWORD_SECRET_NAME: ${{ vars.AZURE_POSTGRESQL_PASSWORD_SECRET_NAME }}
      AZURE_POSTGRESQL_ADMIN_LOGIN: ${{ vars.AZURE_POSTGRESQL_ADMIN_LOGIN }}
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      ENTRA_AUTHORITY: ${{ vars.ENTRA_AUTHORITY }}
      ENTRA_METADATA_URL: ${{ vars.ENTRA_METADATA_URL }}
      ENTRA_EXPECTED_ISSUER: ${{ vars.ENTRA_EXPECTED_ISSUER }}
      ENTRA_AUDIENCE: ${{ vars.ENTRA_AUDIENCE }}
      ENTRA_API_SCOPE_PREFIX: ${{ vars.ENTRA_API_SCOPE_PREFIX }}
      SPEECH_SETTINGS: ${{ vars.EARWYRM_SPEECH_SETTINGS }}
      LYRIC_SETTINGS: ${{ vars.EARWYRM_LYRIC_SETTINGS }}
      EARWYRM_AI_LOCATION: ${{ vars.EARWYRM_AI_LOCATION }}
      EARWYRM_MAINTENANCE_APPROVED: "true"
      EARWYRM_OTHER_WRITERS_STOPPED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Azure/setup-azd@v2.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: payload
          merge-multiple: true
      - name: Verify payload before extracting or executing it
        env:
          EXPECTED_SHA256: ${{ needs.prepare.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  payload/deployment.tar\n' "$EXPECTED_SHA256" | sha256sum --check --strict
          mkdir .deployment
          tar -xf payload/deployment.tar -C .deployment
      - name: GitHub OIDC login for Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: GitHub OIDC login for azd
        run: >-
          azd auth login --client-id "$AZURE_CLIENT_ID"
          --tenant-id "$AZURE_TENANT_ID" --federated-credential-provider github
      - name: Configure isolated environment
        shell: bash
        run: |
          set -euo pipefail
          speech_settings=$(jq -ces 'if length == 1 and (.[0] | type == "object") then .[0] else error("Expected one JSON object") end' <<< "$SPEECH_SETTINGS") ||
            { echo "::error::Set EARWYRM_SPEECH_SETTINGS in the earwyrm-web GitHub environment (see the Azure deployment runbook)."; exit 1; }
          lyric_settings=$(jq -ces 'if length == 1 and (.[0] | type == "object") then .[0] else error("Expected one JSON object") end' <<< "$LYRIC_SETTINGS") ||
            { echo "::error::Set EARWYRM_LYRIC_SETTINGS in the earwyrm-web GitHub environment (see the Azure deployment runbook)."; exit 1; }
          jq -e 'def usd: type == "string" and test("^[0-9]+(\\.[0-9]+)?$") and (tonumber > 0);
            (.perRunCapUsd | usd) and (.totalBudgetUsd | usd) and (.usdPerMillionCharacters | usd)
            and (.rateSource | type == "string" and test("\\S"))
            and (.rateCheckedOn | strings | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") and . <= (now | strftime("%Y-%m-%d")))' <<< "$speech_settings" >/dev/null ||
            { echo "::error::EARWYRM_SPEECH_SETTINGS needs positive USD amounts and dated Speech rate evidence."; exit 1; }
          jq -e 'def usd: type == "string" and test("^[0-9]+(\\.[0-9]+)?$") and (tonumber > 0);
            (.modelName | type == "string" and test("\\S")) and (.modelVersion | type == "string" and test("\\S"))
            and (.modelSku | IN("Standard", "GlobalStandard", "DataZoneStandard"))
            and (.modelCapacity | type == "number" and . > 0 and . == floor)
            and (.modelCallMaxUsd | usd) and (.safetyCallMaxUsd | usd) and (.perActionCapUsd | usd) and (.totalBudgetUsd | usd)' <<< "$lyric_settings" >/dev/null ||
            { echo "::error::EARWYRM_LYRIC_SETTINGS needs a model name, version, supported SKU, positive integer capacity, and positive USD limits."; exit 1; }
          az extension add --name containerapp --upgrade
          azd env new "$AZURE_ENV_NAME" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set AZURE_PRINCIPAL_ID "$AZURE_PRINCIPAL_ID"
          azd env set AZURE_KEY_VAULT_NAME "$AZURE_KEY_VAULT_NAME"
          azd env set AZURE_KEY_VAULT_RESOURCE_GROUP "$AZURE_KEY_VAULT_RESOURCE_GROUP"
          azd env set AZURE_POSTGRESQL_PASSWORD_SECRET_NAME "$AZURE_POSTGRESQL_PASSWORD_SECRET_NAME"
          azd env set AZURE_POSTGRESQL_ADMIN_LOGIN "$AZURE_POSTGRESQL_ADMIN_LOGIN"
          azd env set ENTRA_CLIENT_ID "$ENTRA_CLIENT_ID"
          azd env set ENTRA_AUTHORITY "$ENTRA_AUTHORITY"
          azd env set ENTRA_METADATA_URL "$ENTRA_METADATA_URL"
          azd env set ENTRA_EXPECTED_ISSUER "$ENTRA_EXPECTED_ISSUER"
          azd env set ENTRA_AUDIENCE "$ENTRA_AUDIENCE"
          azd env set ENTRA_API_SCOPE_PREFIX "$ENTRA_API_SCOPE_PREFIX"
          azd env set EARWYRM_SPEECH_SETTINGS_ENCODED "$(printf '%s' "$speech_settings" | base64 -w0)"
          azd env set EARWYRM_LYRIC_SETTINGS_ENCODED "$(printf '%s' "$lyric_settings" | base64 -w0)"
          azd env set EARWYRM_AI_LOCATION "${EARWYRM_AI_LOCATION:-$AZURE_LOCATION}"
      - name: Stop and verify existing writers
        run: node .deployment/tooling/deployment_gate.js quiesce
      - name: Preview resources
        if: inputs.action == 'preview'
        run: azd provision --preview --no-prompt
      - name: Provision approved resources
        if: inputs.action == 'provision' || inputs.action == 'deploy'
        run: azd provision --no-prompt
      - name: Stop and verify bootstrap or replacement writers
        if: inputs.action == 'provision' || inputs.action == 'deploy'
        run: node .deployment/tooling/deployment_gate.js quiesce
      - name: Verify private PostgreSQL networking
        if: inputs.action == 'provision' || inputs.action == 'deploy'
        run: node .deployment/tooling/deployment_gate.js verify-network
      - name: Deploy approved web image
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          node .deployment/tooling/deployment_gate.js verify
          image=$(node .deployment/tooling/publish_deployment_image.js "$(azd env get-value AZURE_CONTAINER_REGISTRY_ENDPOINT)")
          az containerapp update --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$(azd env get-value AZURE_RESOURCE_GROUP)" \
            --name "$(azd env get-value AZURE_CONTAINER_APP_NAME)" --image "$image" --output none
      - name: Resume and check replica count
        if: inputs.action == 'deploy'
        run: node .deployment/tooling/deployment_gate.js resume
