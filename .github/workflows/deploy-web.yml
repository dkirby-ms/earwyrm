name: Approved web deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: Preview first, provision separately, and deploy only after migration
        type: choice
        options: [preview, provision, deploy]
        default: preview
      maintenance_approved:
        description: Approve downtime and this run's cloud operations
        type: boolean
        default: false
      other_writers_stopped:
        description: All other clients writing to this isolated share are stopped
        type: boolean
        default: false
      preview_reviewed:
        description: The target's current preview was reviewed and approved
        type: boolean
        default: false
      postgres_store_initialized:
        description: PostgreSQL was initialized or imported and independently verified
        type: boolean
        default: false
      enable_paid_speech:
        description: Provision Speech on the shared Foundry account and apply approved spending limits
        type: boolean
        default: false
      enable_paid_text:
        description: Provision the approved model on the shared Foundry account and enable screened text
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: earwyrm-web-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      inputs.maintenance_approved && inputs.other_writers_stopped &&
      (inputs.action == 'preview' ||
       (inputs.preview_reviewed &&
        (inputs.action == 'provision' ||
         (inputs.action == 'deploy' && inputs.postgres_store_initialized))))
    runs-on: ubuntu-latest
    environment: earwyrm-web
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
      AZURE_KEY_VAULT_RESOURCE_GROUP: ${{ vars.AZURE_KEY_VAULT_RESOURCE_GROUP }}
      AZURE_POSTGRESQL_PASSWORD_SECRET_NAME: ${{ vars.AZURE_POSTGRESQL_PASSWORD_SECRET_NAME }}
      AZURE_POSTGRESQL_ADMIN_LOGIN: ${{ vars.AZURE_POSTGRESQL_ADMIN_LOGIN }}
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      ENTRA_AUTHORITY: ${{ vars.ENTRA_AUTHORITY }}
      ENTRA_METADATA_URL: ${{ vars.ENTRA_METADATA_URL }}
      ENTRA_EXPECTED_ISSUER: ${{ vars.ENTRA_EXPECTED_ISSUER }}
      ENTRA_AUDIENCE: ${{ vars.ENTRA_AUDIENCE }}
      ENTRA_API_SCOPE_PREFIX: ${{ vars.ENTRA_API_SCOPE_PREFIX }}
      ENABLE_PAID_SPEECH: ${{ inputs.enable_paid_speech }}
      ENABLE_PAID_TEXT: ${{ inputs.enable_paid_text }}
      SPEECH_SETTINGS: ${{ vars.EARWYRM_SPEECH_SETTINGS }}
      LYRIC_SETTINGS: ${{ vars.EARWYRM_LYRIC_SETTINGS }}
      EARWYRM_AI_LOCATION: ${{ vars.EARWYRM_AI_LOCATION }}
      EARWYRM_MAINTENANCE_APPROVED: "true"
      EARWYRM_OTHER_WRITERS_STOPPED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/setup-azd@v2.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked tooling
        run: npm ci --no-audit --no-fund
      - name: GitHub OIDC login for Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: GitHub OIDC login for azd
        run: >-
          azd auth login --client-id "$AZURE_CLIENT_ID"
          --tenant-id "$AZURE_TENANT_ID" --federated-credential-provider github
      - name: Configure isolated environment
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade
          azd env new "$AZURE_ENV_NAME" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set AZURE_PRINCIPAL_ID "$AZURE_PRINCIPAL_ID"
          azd env set AZURE_KEY_VAULT_NAME "$AZURE_KEY_VAULT_NAME"
          azd env set AZURE_KEY_VAULT_RESOURCE_GROUP "$AZURE_KEY_VAULT_RESOURCE_GROUP"
          azd env set AZURE_POSTGRESQL_PASSWORD_SECRET_NAME "$AZURE_POSTGRESQL_PASSWORD_SECRET_NAME"
          azd env set AZURE_POSTGRESQL_ADMIN_LOGIN "$AZURE_POSTGRESQL_ADMIN_LOGIN"
          azd env set ENTRA_CLIENT_ID "$ENTRA_CLIENT_ID"
          azd env set ENTRA_AUTHORITY "$ENTRA_AUTHORITY"
          azd env set ENTRA_METADATA_URL "$ENTRA_METADATA_URL"
          azd env set ENTRA_EXPECTED_ISSUER "$ENTRA_EXPECTED_ISSUER"
          azd env set ENTRA_AUDIENCE "$ENTRA_AUDIENCE"
          azd env set ENTRA_API_SCOPE_PREFIX "$ENTRA_API_SCOPE_PREFIX"
          speech_settings=null
          lyric_settings=null
          if [[ "$ENABLE_PAID_SPEECH" == true ]]; then
            speech_settings=$(jq -ces 'if length == 1 and (.[0] | type == "object") then .[0] else error("Expected one Speech settings object") end' <<< "$SPEECH_SETTINGS")
          fi
          if [[ "$ENABLE_PAID_TEXT" == true ]]; then
            lyric_settings=$(jq -ces 'if length == 1 and (.[0] | type == "object") then .[0] else error("Expected one text settings object") end' <<< "$LYRIC_SETTINGS")
          fi
          azd env set EARWYRM_SPEECH_SETTINGS_ENCODED "$(printf '%s' "$speech_settings" | base64 -w0)"
          azd env set EARWYRM_LYRIC_SETTINGS_ENCODED "$(printf '%s' "$lyric_settings" | base64 -w0)"
          azd env set EARWYRM_AI_LOCATION "${EARWYRM_AI_LOCATION:-$AZURE_LOCATION}"
      - name: Stop and verify existing writers
        run: npm run deployment-gate -- quiesce
      - name: Preview resources
        if: inputs.action == 'preview'
        run: azd provision --preview --no-prompt
      - name: Provision approved resources
        if: inputs.action == 'provision' || inputs.action == 'deploy'
        run: azd provision --no-prompt
      - name: Stop and verify bootstrap or replacement writers
        if: inputs.action == 'provision' || inputs.action == 'deploy'
        run: npm run deployment-gate -- quiesce
      - name: Verify private PostgreSQL networking
        if: inputs.action == 'provision' || inputs.action == 'deploy'
        run: npm run deployment-gate -- verify-network
      - name: Deploy approved web image
        if: inputs.action == 'deploy'
        run: azd deploy web --no-prompt
      - name: Resume and check replica count
        if: inputs.action == 'deploy'
        run: npm run deployment-gate -- resume
